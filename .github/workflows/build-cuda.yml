name: Build llama.cpp (unsloth iq1-narrow) with CUDA

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if iq1-narrow tip is unchanged'
        required: false
        type: boolean
        default: false

# ---- Single source of truth for the upstream fork ----
# Change these two values to retarget the build. They are consumed by every job
# so there is exactly one place to edit (addresses the "URL scattered everywhere"
# hazard). scripts/build.sh and scripts/test-build.sh receive them as arguments.
env:
  UPSTREAM_REPO: https://github.com/unslothai/llama.cpp
  UPSTREAM_BRANCH: iq1-narrow

jobs:
  check-branch:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tip_sha: ${{ steps.check.outputs.tip_sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      release_tag: ${{ steps.check.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect new iq1-narrow tip
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_API: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ env.UPSTREAM_BRANCH }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          UPSTREAM_API="${UPSTREAM_API#https://github.com/}"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          # The unsloth fork publishes NO GitHub Releases, so the old
          # /releases/latest + git-tag dedup model does not apply. Instead we
          # track the branch tip commit SHA and de-duplicate against an
          # existing RELEASE (via the Releases API), not a git tag.
          #
          # Why Releases-API dedup instead of `git tag`?
          #  - actions/checkout@v4 fetches NO tags by default, so `git tag`
          #    would be empty and we would rebuild every single cron run.
          #  - Gating on release existence means the check agrees with the
          #    release job: if the tag was pushed but release creation failed
          #    (orphaned tag), the next run still sees "no release" and
          #    rebuilds/retries automatically — self-healing.
          TIP_SHA=$(curl -fsSL "${AUTH[@]}" \
            "https://api.github.com/repos/${UPSTREAM_API}/branches/${UPSTREAM_BRANCH}" \
            | jq -r '.commit.sha // empty')
          if [ -z "${TIP_SHA}" ]; then
            echo "Could not resolve tip of ${UPSTREAM_BRANCH}; aborting"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHORT_SHA="${TIP_SHA:0:7}"
          TAG="unsloth-${UPSTREAM_BRANCH}-${SHORT_SHA}"

          echo "iq1-narrow tip: ${TIP_SHA} (${SHORT_SHA})"
          echo "Candidate tag: ${TAG}"

          # Query OUR releases for one tagged with this commit's tag.
          # /releases returns [] (200) when empty, never 404, so this is robust
          # under set -e. Mirrors scripts/check-releases.sh exactly.
          EXISTING=$(curl -fsSL "${AUTH[@]}" \
            "https://api.github.com/repos/${THIS_REPO}/releases?per_page=100" \
            | jq -r --arg tag "${TAG}" '.[] | select(.tag_name == $tag) | .tag_name' \
            | head -1)

          if [ -n "${EXISTING}" ]; then
            echo "Release ${TAG} already exists"
            if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
              echo "Force build enabled, building anyway"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No release for ${TAG}; building"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

          echo "tip_sha=${TIP_SHA}"     >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}"     >> "$GITHUB_OUTPUT"

  build:
    needs: check-branch
    if: needs.check-branch.outputs.should_build == 'true'
    runs-on: ${{ matrix.arch.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        cuda_version: ['12.8.1']
        arch:
          # Native runners — no QEMU. nvidia/cuda:*-cudnn-devel-ubuntu22.04 is
          # multi-arch on Docker Hub so the same build path runs on both.
          - { suffix: amd64, runs_on: ubuntu-latest }
          - { suffix: arm64, runs_on: ubuntu-24.04-arm }
        include:
          - cuda_version: '12.8.1'
            cuda_version_short: '12.8'
            cuda_tag: '12.8.1-cudnn-devel-ubuntu22.04'
            # CUDA compute capabilities target the runtime GPU, not the host
            # CPU arch, so the same list applies to both amd64 and arm64
            # builds. Relevant aarch64 GPU contexts (Grace Hopper, Grace
            # Blackwell, DGX Spark) are covered by sm_90 / sm_100 / sm_120.
            architectures: '75-virtual;80-virtual;86-virtual;89-virtual;90-virtual;100-virtual;120-virtual'
            # unsloth build targets (matches the unsloth quick-start recipe).
            build_targets: 'llama-cli llama-mtmd-cli llama-server llama-gguf-split'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          echo "=== Initial Disk Space ==="
          df -h
          
          echo "=== Removing unnecessary packages ==="
          sudo apt-get remove -y '^aspnetcore-.*' || true
          sudo apt-get remove -y '^dotnet-.*' --fix-missing || true
          sudo apt-get remove -y '^llvm-.*' --fix-missing || true
          sudo apt-get remove -y 'php.*' --fix-missing || true
          sudo apt-get remove -y '^mongodb-.*' --fix-missing || true
          sudo apt-get remove -y '^mysql-.*' --fix-missing || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri --fix-missing || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          
          echo "=== Removing large directories ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Clean docker system
          docker system prune -af || true
          
          echo "=== After Cleanup ==="
          df -h

      - name: Build llama.cpp with CUDA
        env:
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ env.UPSTREAM_BRANCH }}
          TIP_SHA: ${{ needs.check-branch.outputs.tip_sha }}
        run: |
          # Pull Docker image
          docker pull nvidia/cuda:${{ matrix.cuda_tag }}

          OUTPUT_DIR="/workspace/binaries/cuda-${{ matrix.cuda_version_short }}"
          # Run the SHARED build recipe (scripts/build.sh) inside the container.
          docker run --rm \
            -v "$PWD":/workspace \
            nvidia/cuda:${{ matrix.cuda_tag }} \
            bash /workspace/scripts/build.sh \
              "${OUTPUT_DIR}" \
              '${{ matrix.architectures }}' \
              "${UPSTREAM_REPO}" \
              "${TIP_SHA}" \
              '${{ matrix.cuda_version_short }}' \
              '${{ matrix.build_targets }}' \
              'OFF'

          # Remove Docker image to free space
          docker rmi nvidia/cuda:${{ matrix.cuda_tag }} || true

          # Fix permissions for files created by root in container
          sudo chown -R "$(id -u):$(id -g)" "$PWD"

          echo "=== Cleaning up cloned source ==="
          rm -rf llama.cpp

          echo "=== Final disk usage ==="
          df -h

      - name: Create tarball
        run: |
          cd binaries
          tar -czf llama.cpp-unsloth-${{ needs.check-branch.outputs.short_sha }}-cuda-${{ matrix.cuda_version_short }}-${{ matrix.arch.suffix }}.tar.gz cuda-${{ matrix.cuda_version_short }}
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # Arch suffix in the artifact name so the matrix jobs do not collide
          # in actions/download-artifact later.
          name: llama.cpp-cuda-${{ matrix.cuda_version_short }}-${{ matrix.arch.suffix }}
          path: binaries/*.tar.gz
          retention-days: 1

  release:
    needs: [check-branch, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the empty advancing commit below sits on top of
          # main HEAD. fetch-tags lets us see pre-existing tags (belt-and-
          # suspenders; the force push below handles collisions regardless).
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create advancing release tag
        # GitHub sorts the /releases list by each release's created_at, which is
        # the *committer date of the tag's target commit* — not the publish
        # time. Anchor each tag to a fresh empty commit whose committer date is
        # build time so created_at advances and new releases sort to the top.
        # The commit is reachable only via its tag; main is never pushed.
        run: |
          set -euo pipefail
          TAG="${{ needs.check-branch.outputs.release_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty \
            -m "unsloth llama.cpp ${TAG} (CUDA build $(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # Force-create the tag so a re-run (force_build, or retry after a
          # failed release step) overwrites a previously-pushed tag for the
          # same commit instead of failing with non-fast-forward.
          git tag -f "${TAG}"
          git push --force origin "refs/tags/${TAG}"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-branch.outputs.release_tag }}
          name: unsloth llama.cpp (iq1-narrow ${{ needs.check-branch.outputs.short_sha }}) with CUDA
          body: |
            # unsloth llama.cpp `iq1-narrow` with CUDA Support

            Pre-built binaries of the [unsloth fork](https://github.com/unslothai/llama.cpp) `iq1-narrow` branch, built with CUDA support.

            **Source:** https://github.com/unslothai/llama.cpp/tree/iq1-narrow
            **Commit:** ${{ needs.check-branch.outputs.tip_sha }}

            > This build tracks the `iq1-narrow` **branch tip**, not upstream GitHub Releases. The tag name embeds the short commit SHA (`unsloth-iq1-narrow-<sha>`).

            ## Build configuration
            - `BUILD_SHARED_LIBS=OFF` (standalone static executables)
            - Targets: `llama-cli`, `llama-mtmd-cli`, `llama-server`, `llama-gguf-split`
            - CUDA 12.8 — GPU compute capabilities: 7.5, 8.0, 8.6, 8.9, 9.0, 10.0, 12.0

            ## Host architectures
            Tarballs are published per host CPU architecture (Linux):
            - `-amd64.tar.gz` — x86_64 (most desktops, servers, cloud VMs)
            - `-arm64.tar.gz` — aarch64 (Grace Hopper / Grace Blackwell / DGX Spark / Ampere Altra)

            ## GPU compute capability reference
            - 7.5: Tesla T4, RTX 20xx series, Quadro RTX
            - 8.0: A100
            - 8.6: RTX 3000 series
            - 8.9: RTX 4000 series, L4, L40
            - 9.0: H100, H200, GH200
            - 10.0: B200, GB200
            - 12.0: RTX Pro series, RTX 50xx

            ## Usage
            Download the tarball matching your host CPU arch and CUDA version, then extract:
            ```bash
            # amd64 host
            tar -xzf llama.cpp-unsloth-${{ needs.check-branch.outputs.short_sha }}-cuda-12.8-amd64.tar.gz
            # arm64 host (e.g. Grace Blackwell)
            tar -xzf llama.cpp-unsloth-${{ needs.check-branch.outputs.short_sha }}-cuda-12.8-arm64.tar.gz
            cd cuda-12.8
            ./llama-cli --help
            ```
          files: release-assets/*
          draft: false
          prerelease: false
