name: Build llama.cpp with CUDA (DFlash2)

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no new release'
        required: false
        type: boolean
        default: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      release_hash: ${{ steps.check.outputs.release_hash }}
      fix_hash: ${{ steps.check.outputs.fix_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve DFlash2 source revisions
        id: check
        run: |
          # This workflow does not track llama.cpp releases: DFlash2 exists only
          # as PR ggml-org/llama.cpp#27342, with the vision (mtmd) fix from
          # z-lab/llama.cpp-fork#1 layered on top of it. Build whenever either
          # head moves. Once the PR lands upstream this can go back to tracking
          # releases (or master).
          PR_SHA=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/pulls/27342 | jq -r '.head.sha')
          FIX_SHA=$(curl -s https://api.github.com/repos/z-lab/llama.cpp-fork/pulls/1 | jq -r '.head.sha')

          if [ -z "$PR_SHA" ] || [ "$PR_SHA" = "null" ] || [ -z "$FIX_SHA" ] || [ "$FIX_SHA" = "null" ]; then
            echo "::error::Could not resolve DFlash2 PR heads (API rate limit or PR gone?)"
            exit 1
          fi

          # The tag embeds both heads so movement on either side triggers a rebuild
          RELEASE_TAG="dflash2-${PR_SHA:0:7}-${FIX_SHA:0:7}"
          
          echo "DFlash2 PR #27342 head: $PR_SHA"
          echo "Vision fix (z-lab#1) head: $FIX_SHA"
          echo "Release tag: $RELEASE_TAG"
          
          # Check if we've already built this source revision
          if git tag | grep -q "^${RELEASE_TAG}$"; then
            echo "Source revision $RELEASE_TAG already built"
            if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
              echo "Force build enabled, building anyway"
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "New source revision detected: $RELEASE_TAG"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
          
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_hash=$PR_SHA" >> $GITHUB_OUTPUT
          echo "fix_hash=$FIX_SHA" >> $GITHUB_OUTPUT

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: ${{ matrix.arch.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        cuda_version: ['12.8.1']
        arch:
          # Native runners — no QEMU. nvidia/cuda:*-cudnn-devel-ubuntu22.04 is
          # multi-arch on Docker Hub so the same build path runs on both.
          - { suffix: amd64, runs_on: ubuntu-latest }
          - { suffix: arm64, runs_on: ubuntu-24.04-arm }
        include:
          - cuda_version: '12.8.1'
            cuda_version_short: '12.8'
            cuda_tag: '12.8.1-cudnn-devel-ubuntu22.04'
            # CUDA compute capabilities target the runtime GPU, not the host
            # CPU arch, so the same list applies to both amd64 and arm64
            # builds. Relevant aarch64 GPU contexts (Grace Hopper, Grace
            # Blackwell, DGX Spark) are covered by sm_90 / sm_100 / sm_120.
            architectures: '75-virtual;80-virtual;86-virtual;89-virtual;90-virtual;100-virtual;120-virtual'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          echo "=== Initial Disk Space ==="
          df -h
          
          echo "=== Removing unnecessary packages ==="
          sudo apt-get remove -y '^aspnetcore-.*' || true
          sudo apt-get remove -y '^dotnet-.*' --fix-missing || true
          sudo apt-get remove -y '^llvm-.*' --fix-missing || true
          sudo apt-get remove -y 'php.*' --fix-missing || true
          sudo apt-get remove -y '^mongodb-.*' --fix-missing || true
          sudo apt-get remove -y '^mysql-.*' --fix-missing || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri --fix-missing || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          
          echo "=== Removing large directories ==="
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          # Clean docker system
          docker system prune -af || true
          
          echo "=== After Cleanup ==="
          df -h

      - name: Build llama.cpp with CUDA
        run: |
          # Pull Docker image
          docker pull nvidia/cuda:${{ matrix.cuda_tag }}
          
          # Run build in container
          docker run --rm \
            -v $PWD:/workspace \
            nvidia/cuda:${{ matrix.cuda_tag }} \
            bash -c "
              set -e
              
              echo '=== Installing minimal dependencies ==='
              apt-get update -qq
              apt-get install -y --no-install-recommends git cmake ninja-build build-essential libssl-dev ca-certificates
              apt-get clean
              rm -rf /var/lib/apt/lists/*
              
              echo '=== Cloning llama.cpp: DFlash2 PR #27342 + vision fix ==='
              cd /workspace
              # DFlash2 is not merged upstream yet, so build the head of
              # ggml-org/llama.cpp#27342 (z-lab/llama.cpp-fork:dflash2) and
              # merge the vision fix from z-lab/llama.cpp-fork#1 on top of it.
              # Both heads are pinned to the SHAs resolved in check-release so
              # the release tag always matches the built source.
              git init llama.cpp
              cd llama.cpp
              git remote add origin https://github.com/ggml-org/llama.cpp.git
              git fetch --depth 300 origin pull/27342/head:dflash2
              if [ "\$(git rev-parse dflash2)" != "${{ needs.check-release.outputs.release_hash }}" ]; then
                echo 'PR #27342 head moved between check and build - aborting; re-run the workflow'
                exit 1
              fi
              git switch dflash2
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git fetch --depth 300 https://github.com/z-lab/llama.cpp-fork.git pull/1/head:dflash2-vision-fix
              if [ "\$(git rev-parse dflash2-vision-fix)" != "${{ needs.check-release.outputs.fix_hash }}" ]; then
                echo 'Vision fix head moved between check and build - aborting; re-run the workflow'
                exit 1
              fi
              # Fast-forward today (fix branch = PR head + 2 commits). If the
              # PR head has moved since, this becomes a real 3-way merge; a
              # conflict fails the build loudly instead of shipping a bad tree.
              git merge --no-edit dflash2-vision-fix
              
              echo '=== Configuring build with Ninja ==='
              export LIBRARY_PATH="/usr/local/cuda/lib64/stubs${LIBRARY_PATH:+:$LIBRARY_PATH}"

              ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
              cmake -B build -S . \
                -G Ninja \
                -DGGML_CUDA=ON \
                -DCMAKE_CUDA_ARCHITECTURES='${{ matrix.architectures }}' \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DGGML_NATIVE=OFF \
                -DLLAMA_BUILD_TESTS=OFF \
                -DLLAMA_BUILD_EXAMPLES=OFF \
                -DCMAKE_EXE_LINKER_FLAGS='-Wl,-rpath-link,/usr/local/cuda/lib64/stubs' \
                -DCMAKE_SHARED_LINKER_FLAGS='-Wl,-rpath-link,/usr/local/cuda/lib64/stubs'
              
              echo '=== Building with Ninja (parallel: all cores) ==='
              cmake --build build --config Release -j\$(nproc)
              
              echo '=== Copying binaries ==='
              cd /workspace
              mkdir -p binaries/cuda-${{ matrix.cuda_version_short }}

              # Copy everything from build/bin
              cp -r llama.cpp/build/bin/* binaries/cuda-${{ matrix.cuda_version_short }}/

              # Strip binaries to reduce size (executables only, not .so files)
              find binaries/cuda-${{ matrix.cuda_version_short }}/ -type f -executable ! -name "*.so*" -exec strip {} \; 2>/dev/null || true

              echo '=== Creating version info ==='
              echo 'llama.cpp source: ggml-org/llama.cpp PR #27342 (DFlash2)' > binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'PR head: ${{ needs.check-release.outputs.release_hash }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'Vision fix: z-lab/llama.cpp-fork PR #1 @ ${{ needs.check-release.outputs.fix_hash }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'CUDA version: ${{ matrix.cuda_version }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'Architectures: ${{ matrix.architectures }}' >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt
              echo 'Build date: '$(date -u +%Y-%m-%d) >> binaries/cuda-${{ matrix.cuda_version_short }}/VERSION.txt

              echo '=== Build complete ==='
              ls -lh binaries/cuda-${{ matrix.cuda_version_short }}/
              
              echo '=== Cleaning up build directory ==='
              rm -rf llama.cpp
            "
          
          # Remove Docker image to free space
          docker rmi nvidia/cuda:${{ matrix.cuda_tag }} || true
          
          # Fix permissions for files created by root in container
          sudo chown -R $(id -u):$(id -g) $PWD
          
          echo "=== Final disk usage ==="
          df -h

      - name: Create tarball
        run: |
          cd binaries
          tar -czf llama.cpp-${{ needs.check-release.outputs.release_tag }}-cuda-${{ matrix.cuda_version_short }}-${{ matrix.arch.suffix }}.tar.gz cuda-${{ matrix.cuda_version_short }}
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # Arch suffix in the artifact name so the matrix jobs do not collide
          # in actions/download-artifact later.
          name: llama.cpp-cuda-${{ matrix.cuda_version_short }}-${{ matrix.arch.suffix }}
          path: binaries/*.tar.gz
          retention-days: 1

  release:
    needs: [check-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so the tag push below is a fast-forward and
          # duplicate tags are visible.
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create advancing release tag
        # GitHub sorts the /releases list by each release's created_at, which is
        # the *committer date of the tag's target commit* — not the publish
        # time. Previously softprops/action-gh-release created every tag at the
        # static main HEAD (unchanged since May 2026), so every release reported
        # the same created_at and the /releases list stopped reflecting recency:
        # API consumers polling the first page never saw newer builds. Anchor
        # each tag to a fresh empty commit whose committer date is build time so
        # created_at advances and new releases sort to the top of the list.
        # The commit is reachable only via its tag; main is never pushed.
        run: |
          set -euo pipefail
          TAG="${{ needs.check-release.outputs.release_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty \
            -m "llama.cpp ${TAG} (CUDA build $(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-release.outputs.release_tag }}
          name: llama.cpp ${{ needs.check-release.outputs.release_tag }} with CUDA (DFlash2)
          body: |
            # llama.cpp ${{ needs.check-release.outputs.release_tag }} with CUDA + DFlash2
            
            Pre-built llama.cpp binaries with CUDA support, built from the **DFlash2** speculative-decoding PR with the multimodal (vision) fix applied on top.
            
            **DFlash2 PR:** https://github.com/ggml-org/llama.cpp/pull/27342 @ `${{ needs.check-release.outputs.release_hash }}`
            **Vision fix:** https://github.com/z-lab/llama.cpp-fork/pull/1 @ `${{ needs.check-release.outputs.fix_hash }}`
            
            The vision fix skips mtmd embedding batches in the draft path and zero-fills draft-cache holes left by image chunks or reused prompt prefixes. Image/PDF requests no longer fail with `draft-dflash`, and every drafted token is still verified by the target model, so output stays exact.
            
            ## CUDA Versions
            - CUDA 12.8 - GPU compute capabilities: 7.5, 8.0, 8.6, 8.9, 9.0, 10.0, 12.0

            ## Host architectures
            Tarballs are published per host CPU architecture (Linux):
            - `-amd64.tar.gz` — x86_64 (most desktops, servers, cloud VMs)
            - `-arm64.tar.gz` — aarch64 (Grace Hopper / Grace Blackwell / DGX Spark / Ampere Altra)

            ## GPU compute capability reference
            - 7.5: Tesla T4, RTX 20xx series, Quadro RTX
            - 8.0: A100
            - 8.6: RTX 3000 series
            - 8.9: RTX 4000 series, L4, L40
            - 9.0: H100, H200, GH200
            - 10.0: B200, GB200
            - 12.0: RTX Pro series, RTX 50xx

            ## Usage
            Download the tarball matching your host CPU arch and CUDA version, then extract:
            ```bash
            # amd64 host
            tar -xzf llama.cpp-${{ needs.check-release.outputs.release_tag }}-cuda-12.8-amd64.tar.gz
            # arm64 host (e.g. Grace Blackwell)
            tar -xzf llama.cpp-${{ needs.check-release.outputs.release_tag }}-cuda-12.8-arm64.tar.gz
            cd cuda-12.8
            ```

            Run Qwen3.8-27B with the DFlash2 drafter (see https://inco.ai/blog/dflash2/):
            ```bash
            ./llama-server \
              -hf ggml-org/Qwen3.8-27B-GGUF:Q4_K_M \
              -hfd incoai/Qwen3.8-27B-DFlash2-GGUF:Q4_K_M \
              --spec-type draft-dflash \
              --spec-draft-n-max 7
            ```
            Add `--mmproj <file>` as usual for vision input.

            Notes from PR #27342 testing:
            - `--spec-draft-n-max 7` matches the published H200 numbers, but on older/slower GPUs (V100, RTX 3090) values of 4-5 benchmarked faster. The drafter's own `dflash.block_count` metadata caps the effective block size.
            - DFlash2 is a single-stream optimization on several backends: parallel slots (`-np` >= 2) may regress versus `draft-mtp` or no speculation depending on hardware.
          files: release-assets/*
          draft: false
          prerelease: false
